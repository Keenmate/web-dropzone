# Builds the examples into static files and serves them with nginx.
#   docker compose up --build   (or: podman compose up --build)
#   → http://localhost:12510
#
# Equivalent to `make image-build && make image-run`; the Makefile image-*
# targets are the primary workflow (runner configurable via .makefile.env).
services:
  examples:
    build: .
    ports:
      - "12510:80"
