<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test — indicator + progress satellites</title>
    <link rel="stylesheet" href="test-fixtures.css">
    <style>
        web-dropzone { display: block; max-width: 420px; }
        web-dropzone-indicator,
        web-dropzone-progress { display: block; margin-top: 8px; max-width: 420px; }
    </style>
</head>
<body>
    <h1>indicator + progress satellites</h1>
    <p>Targeted by <code>e2e/satellites-extra.spec.ts</code>.</p>

    <div class="fixture">
        <div class="fixture-label">web-dropzone-indicator binds via for= and reads the store</div>
        <web-dropzone id="store-ind" render-mode="headless" accept="*/*" max-file-count="10"></web-dropzone>
        <web-dropzone-indicator id="ind" for="store-ind"></web-dropzone-indicator>
    </div>

    <div class="fixture">
        <div class="fixture-label">web-dropzone-progress binds via for= and reflects getOverallProgress</div>
        <web-dropzone id="store-prog" render-mode="headless" accept="*/*" max-file-count="10"></web-dropzone>
        <web-dropzone-progress id="prog" for="store-prog"></web-dropzone-progress>
    </div>

    <div class="fixture">
        <div class="fixture-label">one headless store (#sat) + configured satellites</div>
        <web-dropzone id="sat" render-mode="headless" accept="*/*" auto-upload="false"></web-dropzone>
        <web-dropzone-picker id="pick-card" for="sat" labels='{"prompt": "Drop invoices", "hint": "PDF only"}'></web-dropzone-picker>
        <web-dropzone-picker id="pick-btn" for="sat" selector-appearance="button" labels='{"selectFiles": "Browse"}'></web-dropzone-picker>
        <web-dropzone-picker id="pick-dis" for="sat" selector-appearance="button" disabled></web-dropzone-picker>
        <web-dropzone-picker id="pick-inside" for="sat" inside="true">
            <web-dropzone-list id="list-nested" for="sat" nested="true"></web-dropzone-list>
        </web-dropzone-picker>
        <web-dropzone-list id="list-badges" for="sat" list-appearance="badges"></web-dropzone-list>
        <web-dropzone-list id="list-empty" for="sat" labels='{"noData": "Nothing yet"}'></web-dropzone-list>
        <web-dropzone-indicator id="ind-left" for="sat" position="left" labels='{"indicatorTitle": "Queue"}'></web-dropzone-indicator>
        <web-dropzone-indicator id="ind-off" for="sat" position="inline" drawer="off"></web-dropzone-indicator>
        <web-dropzone-progress id="prog-sat" for="sat"></web-dropzone-progress>
    </div>

    <script type="module">
        import '/src/index.ts';

        // Synthetic upload pump for the progress fixture — drive an upload
        // to see the satellites update.
        const pending = new Map();
        window.__pending = pending;
        window.__pendingNames = () => Array.from(pending.keys());
        window.__progress = (name, pct) => pending.get(name)?.onProgress(pct);
        window.__resolve = (name, outcome = 'ok') => {
            const e = pending.get(name); pending.delete(name);
            if (outcome === 'fail') e.reject(new Error('simulated')); else e.resolve();
        };
        function handler({ file, setProgress: onProgress, signal }) {
            return new Promise((resolve, reject) => {
                pending.set(file.name, { resolve, reject, onProgress, signal });
                signal?.addEventListener('abort', () => { pending.delete(file.name); reject(new DOMException('Aborted', 'AbortError')); });
            });
        }

        customElements.whenDefined('web-dropzone').then(() => {
            for (const id of ['store-ind', 'store-prog', 'sat']) {
                document.getElementById(id).uploadFileCallback = handler;
            }
        });

        window.__addNamed = (id, names) => {
            const dz = document.getElementById(id);
            const files = names.map(n => new File([new Uint8Array(64)], n, { type: 'text/plain' }));
            return dz.addFiles(files);
        };
    </script>
</body>
</html>
