<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test — drag overlay</title>
    <link rel="stylesheet" href="test-fixtures.css">
    <style>
        .target {
            min-height: 120px;
            border: 1px dashed #cbd5e0;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 12px;
            background: #f9fafb;
        }
        web-dropzone { display: none; } /* overlay-only mode hides the host */
    </style>
</head>
<body>
    <h1>drag overlay (overlay-target)</h1>
    <p>Targeted by <code>e2e/drag-overlay.spec.ts</code>.</p>

    <div class="fixture">
        <div class="fixture-label">overlay-target="target" — overlay covers the existing element on dragenter</div>
        <div id="target" class="target">A normal-looking input target. Drag files over it to reveal the overlay.</div>
        <div id="target2" class="target">A second target (used by the two-overlays test).</div>
        <web-dropzone id="overlay-dz" overlay-target="target" accept="*/*" max-file-count="10"></web-dropzone>
        <pre class="event-log" data-testid="overlay-log"></pre>
    </div>

    <script type="module">
        import '/src/index.ts';
        import { logEvents } from './fixture-kit.js';

        // Specs assert the lifecycle via the log, not the overlay internals.
        const log = document.querySelector('[data-testid="overlay-log"]');
        window.__wire = (el) => logEvents(el, ['overlay-enter', 'overlay-leave', 'file-add'], log);
        customElements.whenDefined('web-dropzone').then(() => window.__wire(document.getElementById('overlay-dz')));
    </script>
</body>
</html>
