<meta name="kmwc:layout" content="bare">

<!-- Header, cards, footer, version badge and the cross-page nav are rendered by
     the devkit from the registry below + package.json#kmwc. The component entry
     stays loaded (no kmwc:entry "none"): the intro card reads both package
     versions from window.components['web-dropzone']. -->
<template id="index-intro">
    <div class="card">
        <h2>Three modes, one component</h2>
        <p>Pick a render mode up-front via the <code>render-mode</code> attribute — it's a hard switch that decides who renders what.</p>
        <ul>
            <li><strong><code>render-mode="bulk"</code></strong> (default) — framework owns the UI; you style via CSS variables. See <a href="examples-display.html">Display &amp; Composition</a> / <a href="examples-validation.html">Validation</a>.</li>
            <li><strong><code>render-mode="structural"</code></strong> — framework owns the lifecycle; you provide HTML structure via render callbacks (including <code>renderListWrapperCallback</code> for tables and element-returning rows with <code>file-row-update</code> events). See <a href="examples-structural.html">Structural Rendering</a>.</li>
            <li><strong><code>render-mode="headless"</code></strong> — framework just fires events (<code>files-change</code> on rAF + granular ones); bring your own renderer or pair with satellites. See <a href="examples-architecture.html">Architecture</a>.</li>
        </ul>
        <p>The pages below, by topic:</p>
        <ul class="index-groups" data-index-groups></ul>
        <p class="index-versions">
            <span class="pill"><code>@keenmate/web-dropzone</code> <strong data-renderer-version>…</strong></span>
            <span class="pill"><code>@keenmate/web-dropzone-core</code> <strong data-core-version>…</strong></span>
        </p>
    </div>
</template>

<style>
    .index-groups a { white-space: nowrap; }
    .index-versions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0; }
</style>

<script type="module">
    import { renderExamplesIndex } from '@keenmate/web-components-devkit/examples';

    // Demo page registry, grouped — add new pages here; they appear automatically.
    const pageGroups = [
        {
            title: 'Technical reference',
            hint: 'One concept per page — the API building blocks',
            pages: [
                {
                    href: 'examples-architecture.html',
                    icon: '🛰️',
                    title: 'Architecture: store + satellites',
                    description: 'Headless <web-dropzone> store with <web-dropzone-picker>, <web-dropzone-list>, and <web-dropzone-indicator> satellites — plus a BYO-renderer example using files-change.'
                },
                {
                    href: 'examples-display.html',
                    icon: '🎛️',
                    title: 'Display & Composition',
                    description: 'Selector / list appearance axes, card sizes, popover placement, files-inside layout, single vs multiple, accept patterns, and the programmatic API.'
                },
                {
                    href: 'examples-validation.html',
                    icon: '✅',
                    title: 'Validation & Rejection',
                    description: 'maxSize, maxFiles, MIME/extension filters, custom validators, async confirmation gates, and file-reject handling.'
                },
                {
                    href: 'examples-upload.html',
                    icon: '📤',
                    title: 'Upload Pipeline',
                    description: 'uploadFileCallback with pause / resume / retry, concurrency, manual mode, and resume-aware progress via ctx.startBytes.'
                },
                {
                    href: 'examples-structural.html',
                    icon: '✨',
                    title: 'Structural Rendering',
                    description: 'render-mode="structural" — override file items, prompts, summaries, AND the list wrapper (table layouts!). Element-returning rows survive state ticks via file-row-update events.'
                },
                {
                    href: 'examples-form.html',
                    icon: '📝',
                    title: 'Form Integration',
                    description: 'Form-associated submission with real FormData, automatic form reset, and field naming.'
                },
                {
                    href: 'examples-drag-overlay.html',
                    icon: '🎯',
                    title: 'Drag Overlay',
                    description: 'Trigger a full-element drop overlay when files are dragged over an existing input or form area.'
                },
                {
                    href: 'examples-theming.html',
                    icon: '🎨',
                    title: 'Theming & Sizing',
                    description: 'Three levels: --base-* (cross-component), --dz-* (component), --dz-rem (global scaling). Live playground + recipe for building your own theme.'
                },
                {
                    href: 'examples-logging.html',
                    icon: '🐛',
                    title: 'Logging & Debugging',
                    description: 'Built-in logging system with categorized debug output for development and troubleshooting.'
                }
            ]
        },
        {
            title: 'Real-world scenarios',
            hint: 'Applied demos showing what\'s possible',
            pages: [
                {
                    href: 'examples-sharepoint-collisions.html',
                    icon: '🗂️',
                    title: 'SharePoint-style name collision check',
                    description: 'Pre-upload server check for existing filenames, per-row Overwrite / Rename / Skip decisions via render-mode="structural".'
                },
                {
                    href: 'examples-split-overlay.html',
                    icon: '📨',
                    title: 'Outlook-style split overlay',
                    description: 'Two dropzones share the viewport — split-screen "attach as file" vs "share as link" reveal during drag.'
                }
            ]
        },
        {
            title: 'Framework integration',
            hint: 'Each wraps the headless store in a host framework',
            pages: [
                {
                    href: 'examples-lit.html',
                    icon: '🔥',
                    title: 'Lit integration',
                    description: 'A LitElement wraps the headless store and renders a reactive file list with lit-html templates.'
                },
                {
                    href: 'examples-react.html',
                    icon: '⚛️',
                    title: 'React integration',
                    description: 'React component using useRef + useEffect + files-change. JSX via htm so it runs build-free in the browser.'
                },
                {
                    href: 'examples-vue.html',
                    icon: '🟢',
                    title: 'Vue 3 integration',
                    description: 'Vue 3 setup() component with isCustomElement opt-in, refs, and computed stats driven by the store.'
                }
            ]
        }
    ];

    const indexElement = renderExamplesIndex({
        pages: pageGroups.flatMap((pageGroup) => pageGroup.pages),
        links: [{ label: 'Architecture', href: 'https://github.com/keenmate/web-dropzone/blob/main/ARCHITECTURE.md' }],
    });

    // The intro card goes between the header and the page cards. The cards are
    // one flat grid (renderExamplesIndex has no groups), so the grouping is
    // spelled out in the intro, from the same registry.
    const introFragment = document.getElementById('index-intro').content.cloneNode(true);
    const escapeHtml = (text) => text.replace(/[&<>"']/g, (character) => `&#${character.charCodeAt(0)};`);
    introFragment.querySelector('[data-index-groups]').innerHTML = pageGroups
        .map((pageGroup) => `<li><strong>${escapeHtml(pageGroup.title)}</strong> — ${escapeHtml(pageGroup.hint)}: ${pageGroup.pages
            .map((page) => `<a href="${escapeHtml(page.href)}">${escapeHtml(page.title)}</a>`)
            .join(', ')}</li>`)
        .join('');
    indexElement.querySelector('header').after(introFragment);

    // Both package versions, from the renderer's global API (the entry is loaded in <head>).
    const componentConfig = window.components?.['web-dropzone']?.config;
    if (componentConfig) {
        document.querySelector('[data-renderer-version]').textContent = `v${componentConfig.version}`;
        document.querySelector('[data-core-version]').textContent = `v${componentConfig.core.version}`;
    }
</script>
